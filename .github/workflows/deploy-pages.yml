name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for custom domain
        run: npm run build

      - name: Create real HTML entry points for sitemap routes
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8')
          const shell = fs.readFileSync('dist/index.html', 'utf8')
          const routes = [...sitemap.matchAll(/<loc>https:\/\/kandyanhandicraftcenter\.lk([^<]*)<\/loc>/g)]
            .map((match) => match[1] || '/')

          for (const route of routes) {
            if (route === '/') continue

            const cleanRoute = route.replace(/^\/+|\/+$/g, '')
            if (!cleanRoute) continue

            const routeDir = path.join('dist', cleanRoute)
            fs.mkdirSync(routeDir, { recursive: true })
            fs.writeFileSync(path.join(routeDir, 'index.html'), shell)
          }

          console.log(`Created ${Math.max(routes.length - 1, 0)} static route entry points.`)
          NODE

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
